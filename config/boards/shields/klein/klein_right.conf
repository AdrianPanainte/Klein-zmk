CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_I2C=y
CONFIG_ZMK_MOUSE=y

# Deep sleep after 45 min of inactivity (default is 15 min)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2700000

# Report min(left, right) battery to the host via src/battery_lowest.c,
# which replaces the stock Battery Service on this half
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_BT_BAS=n
